<!DOCTYPE html>
<html>
  <head>
    <title>EyeCareProject</title>
    <link id="theme" rel="stylesheet" href="eye-care-style.css">
  </head>

  <body>
    <audio class="sound-effect" src="sound-effect.mp3"></audio>
    <div class="main">
      <div class="settings-menu">
        <h2 class="settings-text" style="
            align-self: center;
            font-size: 30px;
          ">Settings</h2>
        <div>
          <input type="number" min="1" id="run-time" class="run-timer">
          <label class="running-time-text" for="run-time">Set running timer(min)</label>
        </div>
        <div>
          <input type="number" min="1" id="rest-time" class="rest-timer">
          <label class="rest-timer-text" for="rest-time">Set rest timer(sec)</label>
        </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <label class="switch">
        <input class="checkbox-sound-effects" type="checkbox">
        <span class="slider"></span>
        </label>
        <span class="label-text-sound-effects">Sound effects</span>
      </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <label class="switch">
          <input class="checkbox-dark-mode" type="checkbox">
          <span class="slider"></span>
          </label>
          <span class="label-text-dark-mode">Enable dark mode</span>
        </div>

        <button onclick="
        resetCycleCounter();
        " class="cycle-reset">Reset cycle counter</button>

        <div class="settings-buttons">
          <button onclick="
              saveAndQuit();
            " class="save-and-quit">Save&Quit</button>
          <button onclick="
            restoreToDefault();
          " class="restore-default">Restore to default</button>
        </div>
      </div>

      <div class ="info-page" 
        style="
          display: none;
        ">
        <button class="close-info">X</button>
        <h1 class="info-title">Information</h1>
        <p class="info"></p>
      </div>

     <div class="upper-row">
      <p class="cycle-counter">Cycles passed : 0</p>
       <h2 class="header"> EyeCare Project</h2>
       <button onclick="
          displayInfo();
       " class ="info-button"><span class="info-symbol">&#8505;</span></button>

       <button onclick="
          displaySettings();
       " class="settings-button"><span class="settings-symbol">&#9881;</span></button>
     </div>
      <h1 class="rest-alert">Start Counting</h1>
      <h1 class="timer">00:10</h1>
        <div class="buttons">
          <button onclick="
              startTimer();
            " class="start-button">Start</button>

            <button onclick="
              resetTimer();
            " class="reset-button">Reset</button>

            <button class="skip-rest-button" style="display: none;" onclick="skipRest()">Skip rest</button>
        </div>
      </div>
     

    <script src="eye-care-script.js"></script>
    <script>
      const minute = Math.floor(remainingSeconds / 60);
      const second = remainingSeconds % 60;
      document.querySelector('.timer').innerHTML = `${String(minute).padStart(2, '0')}:${String(second).padStart(2, '0')}`;
    </script>
  </body>
</html>
